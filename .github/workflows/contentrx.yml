name: ContentRX

on:
  pull_request:
    paths:
      - "src/**/*.tsx"
      - "src/**/*.jsx"
      - "src/**/*.html"
      - "public/**/*.html"

permissions:
  contents: read
  pull-requests: write

jobs:
  contentrx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run ContentRX
        # Action lives inside the main contentRX repo until it splits
        # to its own public repo (per github-action/CLAUDE.md). The
        # `@main` ref tracks the latest production action; pin to a
        # specific SHA once the action is on the Marketplace.
        uses: thenewforktimes/ContentRX/github-action@main
        with:
          api-key: ${{ secrets.CONTENTRX_API_KEY }}
          # Note: the action's _expand_braces only handles a single
          # brace group, so `{src,public}/**/*.{tsx,jsx,html}` matches
          # nothing. Default `**/*.{tsx,jsx,html}` works correctly;
          # the workflow's `paths:` filter above already restricts
          # which PRs trigger the run.
          # advisory-only on the first PR — switch to "review" once the
          # team has triaged the initial backlog.
          fail-on: none
          max-checks: 200
